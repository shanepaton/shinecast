<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="92" height="92">
  <style>
    .light { fill: #358630; }
    .dark { fill: #2e6835; }
  </style>
  <!-- One tile of the background. The cell is drawn four times, shifted so its pieces wrap around the tile's edges. -->
  <defs>
    <g id="cell">
      <polygon class="light" points="192,192 192,128 256,128 256,256 128,256 128,192"/>
      <polygon class="dark" points="64,128 128,128 128,64 192,64 192,0 256,0 256,128 192,128 192,192 128,192 128,256 0,256 0,192 64,192"/>
      <rect class="dark" width="64" height="64"/>
      <polygon class="light" points="64,0 128,0 192,0 192,64 128,64 128,128 64,128 64,192 0,192 0,64 64,64"/>
    </g>
  </defs>
  <use href="#cell" x="-128" y="-128"/>
  <use href="#cell" x="128" y="-128"/>
  <use href="#cell" x="-128" y="128"/>
  <use href="#cell" x="128" y="128"/>
</svg>
